name: Issue 1662 validation
on:
  push:
    branches: [validation/1662-checks]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint diagnostics
        continue-on-error: true
        run: pnpm exec eslint . --fix --format json --output-file lint-diagnostics.json
      - name: Save mechanical fixes
        if: always()
        run: git diff --binary > mechanical-fixes.patch
      - name: Build
        continue-on-error: true
        run: pnpm build > build-diagnostics.log 2>&1
      - name: Regression tests
        continue-on-error: true
        run: pnpm exec vitest run lib/__tests__/gdpr-merge.test.ts lib/__tests__/app-route-layout.test.ts lib/__tests__/proxy-merge.test.ts lib/__tests__/volume-discount-merge.test.ts lib/volunteers components/organisms/VolunteerCoordination --maxWorkers=2 --minWorkers=1 > regression-tests.log 2>&1
      - name: Full test suite
        timeout-minutes: 5
        continue-on-error: true
        run: pnpm exec vitest run --maxWorkers=2 --minWorkers=1 > full-tests.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics
          path: |
            mechanical-fixes.patch
            lint-diagnostics.json
            build-diagnostics.log
            regression-tests.log
            full-tests.log
